{% extends "base.html" %}
{% block title %}Issue Stock{% endblock %}
{% block page_title %}Issue Stock to Salesperson{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
<form method="post">
  <div class="row g-3 mb-3">
    <div class="col-md-4"><label class="form-label">Salesperson *</label>
      <select required name="employee_id" class="form-select">
        <option value="">-- select --</option>
        {% for e in employees %}<option value="{{ e.EmployeeID }}">{{ e.EmployeeName }}{% if e.Designation %} ({{ e.Designation }}){% endif %}</option>{% endfor %}
      </select></div>
    <div class="col-md-3"><label class="form-label">Issue Date *</label>
      <input required type="date" name="issue_date" class="form-control" value="{{ today }}"></div>
    <div class="col-md-5"><label class="form-label">Notes</label>
      <input name="notes" class="form-control" placeholder="e.g. route/area covered today"></div>
  </div>

  <h6>Products Issued</h6>
  <div class="table-responsive">
  <table class="table" id="lines-table">
    <thead><tr><th style="width:40%">Product (available stock)</th><th>Qty Issued</th><th>Unit Price</th><th></th></tr></thead>
    <tbody id="lines-body"></tbody>
  </table>
  </div>
  <button type="button" class="btn btn-sm btn-outline-secondary mb-3" id="add-line">+ Add Line</button>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-brand">Issue Stock</button>
    <a href="{{ url_for('stock_issues_list') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div></div>

<template id="line-template">
  <tr>
    <td>
      <select name="product_id[]" class="form-select prod-select" required>
        <option value="">-- select product --</option>
        {% for p in products %}
        {% set scheme_discount = ((p.CostPrice or 0) * (p.SchemePercent or 0) / 100) if p.SchemePercent else 0 %}
        <option value="{{ p.ProductID }}" data-price="{{ p.SellingPrice or 0 }}" data-stock="{{ p.CurrentStock }}" data-scheme-price="{{ ((p.SellingPrice or 0) - scheme_discount)|round(2) if scheme_discount else '' }}" data-scheme-name="{{ p.SchemeName or '' }}" data-scheme-percent="{{ p.SchemePercent or 0 }}">{{ p.ProductName }} — stock {{ p.CurrentStock|round(1) }} {{ p.Unit }}{% if scheme_discount %} (scheme {{ p.SchemePercent|round(1) }}%){% endif %}</option>
        {% endfor %}
      </select>
    </td>
    <td><input type="number" step="0.01" name="qty[]" class="form-control qty-input" style="width:100px" required></td>
    <td>
      <input type="number" step="0.01" name="unit_price[]" class="form-control price-input" style="width:100px" required>
      <div class="text-warning small price-zero-warning" style="display:none">No price set for this product — please enter one.</div>
      <div class="text-info small scheme-hint" style="display:none"></div>
    </td>
    <td><button type="button" class="btn btn-sm btn-outline-danger remove-line">✕</button></td>
  </tr>
</template>
{% endblock %}
{% block scripts %}
<script>
const body = document.getElementById('lines-body');
const tmpl = document.getElementById('line-template');

function addLine() {
  const clone = tmpl.content.cloneNode(true);
  body.appendChild(clone);
  wireRow(body.lastElementChild);
}

function wireRow(row) {
  const prod = row.querySelector('.prod-select');
  const price = row.querySelector('.price-input');
  const warning = row.querySelector('.price-zero-warning');
  const hint = row.querySelector('.scheme-hint');
  prod.addEventListener('change', () => {
    const opt = prod.options[prod.selectedIndex];
    const schemePrice = opt.dataset.schemePrice;
    const priceVal = schemePrice ? parseFloat(schemePrice) : parseFloat(opt.dataset.price || 0);
    price.value = priceVal;
    warning.style.display = (opt.value && priceVal <= 0) ? '' : 'none';
    if (schemePrice) {
      hint.textContent = `${opt.dataset.schemeName || 'Scheme'}: -${opt.dataset.schemePercent}% of cost applied (full price ₹${opt.dataset.price})`;
      hint.style.display = '';
    } else {
      hint.style.display = 'none';
    }
  });
  price.addEventListener('input', () => {
    warning.style.display = (parseFloat(price.value) || 0) > 0 ? 'none' : warning.style.display;
  });
  row.querySelector('.remove-line').addEventListener('click', () => { row.remove(); });
}

document.getElementById('add-line').addEventListener('click', addLine);
addLine();
</script>
{% endblock %}
