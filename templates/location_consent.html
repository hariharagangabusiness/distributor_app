<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Tracking Consent | Hari Hara Ganga</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <button type="button" id="themeToggle" class="btn btn-sm btn-outline-light theme-toggle-floating" title="Toggle dark mode">
    <i class="bi bi-moon-stars-fill" id="themeToggleIcon"></i>
  </button>
  <div class="auth-card" style="max-width:560px">
    <div class="auth-brand"><img src="{{ url_for('static', filename='img/logo-full.png') }}" alt="Hari Hara Ganga" class="auth-logo-full"></div>
    <h5 class="text-center mb-3"><i class="bi bi-geo-alt-fill"></i> Location Tracking Notice</h5>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category=='error' else category }} alert-dismissible fade show py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="small mb-4" style="white-space:pre-line">{{ consent_text }}</div>

    <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-brand w-100" type="submit"><i class="bi bi-check2-circle"></i> I Accept</button>
    </form>
    <form method="post" action="{{ url_for('logout') }}" class="mt-2">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-outline-secondary w-100" type="submit">I do not agree — Log out</button>
    </form>
    <p class="text-muted small text-center mt-3 mb-0">This notice is shown at every login and your response is
      recorded.</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    var html = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var icon = document.getElementById('themeToggleIcon');
    function setIcon(theme) {
      icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    }
    setIcon(html.getAttribute('data-bs-theme') || 'light');
    btn.addEventListener('click', function () {
      var next = (html.getAttribute('data-bs-theme') === 'dark') ? 'light' : 'dark';
      html.setAttribute('data-bs-theme', next);
      setIcon(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
