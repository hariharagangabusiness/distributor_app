<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hari Hara Ganga</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <button type="button" id="themeToggle" class="btn btn-sm btn-outline-light theme-toggle-floating" title="Toggle dark mode">
    <i class="bi bi-moon-stars-fill" id="themeToggleIcon"></i>
  </button>
  <div class="landing-hero">
    <img src="{{ url_for('static', filename='img/logo-full.png') }}" alt="Hari Hara Ganga" class="landing-logo-full">
    <p class="landing-subtitle">Distributor Ops Manager</p>
    <p>Inventory, sales &amp; GST invoicing, purchases, expenses, vehicle
       maintenance, and payroll with leave &amp; attendance — all in one place.</p>
    <a href="{{ url_for('login') }}" class="btn btn-light btn-lg px-4"><i class="bi bi-box-arrow-in-right"></i> Login</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    var html = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var icon = document.getElementById('themeToggleIcon');
    function setIcon(theme) {
      icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    }
    setIcon(html.getAttribute('data-bs-theme') || 'light');
    btn.addEventListener('click', function () {
      var next = (html.getAttribute('data-bs-theme') === 'dark') ? 'light' : 'dark';
      html.setAttribute('data-bs-theme', next);
      setIcon(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
