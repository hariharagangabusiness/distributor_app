{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px"><div class="card-body">
<form method="post">
  <div class="mb-3"><label class="form-label">Current Password *</label>
    <input required type="password" name="current_password" class="form-control" autocomplete="current-password"></div>
  <div class="mb-3"><label class="form-label">New Password *</label>
    <input required type="password" name="new_password" class="form-control" autocomplete="new-password" minlength="6"></div>
  <div class="mb-3"><label class="form-label">Confirm New Password *</label>
    <input required type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="6"></div>
  <button class="btn btn-brand" type="submit">Change Password</button>
</form>
</div></div>
{% endblock %}
