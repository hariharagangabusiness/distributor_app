{% extends "base.html" %}
{% block title %}Record Advance{% endblock %}
{% block page_title %}Record Employee Advance{% endblock %}
{% block content %}
<div class="card" style="max-width:640px"><div class="card-body">
<form method="post">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Employee *</label>
      <select required name="employee_id" class="form-select">
        <option value="">-- select --</option>
        {% for e in employees %}<option value="{{ e.EmployeeID }}">{{ e.EmployeeName }}</option>{% endfor %}
      </select></div>
    <div class="col-md-6"><label class="form-label">Advance Date *</label>
      <input required type="date" name="advance_date" class="form-control" value="{{ today }}"></div>
    <div class="col-md-6"><label class="form-label">Amount *</label>
      <input required type="number" step="0.01" name="amount" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Repayment (months)</label>
      <input type="number" name="repayment_months" class="form-control" value="1"></div>
    <div class="col-md-12"><label class="form-label">Reason</label>
      <input name="reason" class="form-control"></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-brand" type="submit">Save Advance</button>
    <a href="{{ url_for('advances_list') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div></div>
{% endblock %}
