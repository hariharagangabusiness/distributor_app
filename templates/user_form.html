{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block page_title %}Add User{% endblock %}
{% block content %}
<div class="card" style="max-width:520px"><div class="card-body">
<form method="post">
  <div class="row g-3">
    <div class="col-md-8"><label class="form-label">Username *</label>
      <input required name="username" class="form-control" autocomplete="off"></div>
    <div class="col-md-4"><label class="form-label">Role</label>
      <select name="role" class="form-select">
        <option value="Staff" selected>Staff</option>
        <option value="Admin">Admin</option>
      </select></div>
    <div class="col-12"><label class="form-label">Full Name</label>
      <input name="full_name" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Password *</label>
      <input required type="password" name="password" class="form-control" autocomplete="new-password" minlength="6"></div>
    <div class="col-md-6"><label class="form-label">Confirm Password *</label>
      <input required type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="6"></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-brand" type="submit">Create User</button>
    <a href="{{ url_for('users_list') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div></div>
{% endblock %}
